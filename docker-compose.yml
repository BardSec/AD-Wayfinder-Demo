version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5003:5000"
    environment:
      - USE_MOCK_DATA=true
      - AUTH_ENABLED=false
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5002:80"
    depends_on:
      - backend
    restart: unless-stopped
